name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend-Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fillens
          POSTGRES_PASSWORD: fillens
          POSTGRES_DB: fillens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fillens -d fillens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Tests
        env:
          FILLENS_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://fillens:fillens@localhost:5432/fillens_test' || '' }}
        run: uv run pytest -q

  frontend:
    name: Frontend-Typprüfung und Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
